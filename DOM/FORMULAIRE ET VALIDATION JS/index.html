<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire et validation</title>
</head>

<body>
    <form id="formulaire">
        <input type="text" id="nom" placeholder="Entrer votre name"> <br><br>
        <input type="email" id="email" placeholder="you@gmail.com" required minlength="8"><br><br>
        <input type="number" id="age" placeholder="Votre age">
        <button id="envoyer">Envoyer</button>
        <p id="message"></p>
    </form>
    <script src="script.js"></script>
</body>

</html>
